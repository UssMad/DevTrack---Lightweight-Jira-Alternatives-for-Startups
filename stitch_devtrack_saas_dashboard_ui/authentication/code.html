<style>
        /* Custom styles to handle specific tokens not perfectly mapped by Tailwind config out of the box */
        body { font-family: 'Geist', sans-serif; }

<body class="bg-surface-container-lowest text-on-background min-h-screen flex overflow-hidden antialiased">
<!-- Left Side: Illustration / Visual Anchor -->
<div class="hidden lg:flex lg:w-1/2 relative bg-surface-dim items-center justify-center overflow-hidden border-r border-outline-variant/10">
<!-- Generative Artwork -->
<img alt="Cybernetic network" class="absolute inset-0 w-full h-full object-cover opacity-60 mix-blend-luminosity" data-alt="A sophisticated abstract 3D rendering representing a high-performance digital network and code infrastructure. Glowing, highly detailed cyan and indigo data streams flow through a complex, dark architectural grid. The lighting is dramatic and moody, utilizing a deep #0B0E14 background aesthetic with sharp, glassmorphic floating elements. The overall mood is hyper-technical, secure, and visually striking, fitting for an advanced developer platform login screen." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDjdf9eOJKxhjpT0DvM8n740-Vum_5uSHx6FQFXOgiSHHJFko4cuy4aVTLWBvWlz7O1YAUstleWEL4aZ_VkE_7MwjE7CULXFEskEXluv7Fab6PWpvEHSoZ6adKHPGN6Wu-6-FEzbVD-xejd7WmXqVL4xtOCLhTWA9Z6M83WGS-_EvCdPSlrvhL3IEyZl71MzRbqVI8ctvdORR4OoSPnXTdJLdNIRVh8XFqTCLHOJwsz_cErO355wV43_bwYoVNusLBhtL7LDBRaEMOQ"/>
<!-- Gradient Overlay to blend and soften -->
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest/80 to-transparent"></div>
<div class="absolute inset-0 bg-gradient-to-r from-transparent to-surface-container-lowest/90"></div>
<!-- Optional Subtle Branding/Quote overlay on image -->
<div class="relative z-10 p-xl max-w-lg mt-auto mb-xl mr-auto ml-xl border border-outline-variant/20 bg-surface-container/30 backdrop-blur-xl rounded-xl shadow-[0_20px_40px_rgba(0,0,0,0.4)]">
<p class="font-h3 text-h3 text-on-surface mb-sm">"Engineering the future requires tools that get out of the way."</p>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="bolt">bolt</span>
                High-performance workflow
            </p>
</div>
</div>
<!-- Right Side: Login Form Canvas -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-lg sm:p-xl relative z-10 bg-surface-container-lowest">
<!-- Form Container -->
<div class="w-full max-w-[420px] flex flex-col gap-lg">
<!-- Header Section -->
<div class="flex flex-col gap-xs mb-md">
<div class="flex items-center gap-sm mb-lg">
<div class="w-10 h-10 rounded-lg bg-gradient-to-br from-inverse-primary to-secondary-container flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white" data-icon="terminal">terminal</span>
</div>
<span class="font-h2 text-h2 font-bold tracking-tight text-on-surface">DevTrack</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access your workspace.</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant text-[20px]" data-icon="mail">mail</span>
<input class="w-full bg-surface border border-outline-variant/30 text-on-surface rounded-lg pl-[44px] pr-md py-[10px] font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant/50" id="email" name="email" placeholder="developer@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant text-[20px]" data-icon="lock">lock</span>
<input class="w-full bg-surface border border-outline-variant/30 text-on-surface rounded-lg pl-[44px] pr-md py-[10px] font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant/50 font-code" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me (Optional structural addition for standard login flow) -->
<div class="flex items-center gap-sm mt-xs mb-sm">
<input class="w-4 h-4 rounded-[4px] bg-surface border-outline-variant/30 text-inverse-primary focus:ring-inverse-primary focus:ring-offset-surface-container-lowest" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full flex items-center justify-center gap-sm bg-gradient-to-r from-inverse-primary to-secondary-container hover:from-primary hover:to-secondary-fixed text-white font-body-md text-body-md font-semibold py-[12px] rounded-lg transition-all shadow-[0_0_20px_rgba(73,75,214,0.2)] hover:shadow-[0_0_25px_rgba(73,75,214,0.4)]" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-lg text-center border-t border-outline-variant/10 pt-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary hover:text-primary-fixed-dim font-semibold transition-colors" href="#">Request Access</a>
</p>
</div>
</div>
</div>
</body></html>
